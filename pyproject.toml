[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nfc-url-writer"
version = "1.0.0"
description = "Cross-platform desktop app for writing URLs to NFC tags using ACR122U reader"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "NFC URL Writer Contributors"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
]

dependencies = [
    "PyQt6>=6.4.0",
    "nfcpy>=1.0.4",
    "opencv-python>=4.7.0",
    "pyzbar>=0.1.9",
]

[project.scripts]
nfc-url-writer = "nfc_url_writer.main:main"

[tool.setuptools]
packages = ["nfc_url_writer", "nfc_url_writer.config", "nfc_url_writer.nfc", "nfc_url_writer.qr", "nfc_url_writer.ui"]

